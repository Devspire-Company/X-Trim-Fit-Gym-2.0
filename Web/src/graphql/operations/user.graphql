query Me {
	me {
		id
		firstName
		middleName
		lastName
		email
		role
		phoneNumber
		dateOfBirth
		gender
	}
}

query GetUsers($role: RoleType, $includeDisabled: Boolean) {
	getUsers(role: $role, includeDisabled: $includeDisabled) {
		id
		firstName
		middleName
		lastName
		email
		role
		phoneNumber
		dateOfBirth
		gender
		heardFrom
		attendanceId
		membershipDetails {
			membershipId
			physiqueGoalType
			fitnessGoal
			workOutTime
			coachesIds
			hasEnteredDetails
			facilityBiometricEnrollmentComplete
			membershipTransaction {
				id
				membershipId
				membership {
					id
					name
					monthlyPrice
					description
					features
					status
					durationType
					monthDuration
				}
				priceAtPurchase
				startedAt
				expiresAt
				monthDuration
				dayDuration
				status
			}
		}
		currentMembership {
			id
			membershipId
			membership {
				id
				name
				monthlyPrice
				description
				features
				status
				durationType
				monthDuration
			}
			priceAtPurchase
			startedAt
			expiresAt
			monthDuration
			dayDuration
			status
		}
		coachDetails {
			clientsIds
			sessionsIds
			specialization
			ratings
			yearsOfExperience
			moreDetails
			teachingDate
			teachingTime
			clientLimit
		}
		loginHistory {
			ipAddress
			userAgent
			loginAt
		}
		isDisabled
		disabledAt
		disableReason
		createdAt
		updatedAt
	}
}

