query GetEquipments($includeArchived: Boolean) {
  getEquipments(includeArchived: $includeArchived) {
    id
    name
    imageUrl
    description
    notes
    acquiredAt
    sortOrder
    status
    quantity
    maintenanceStartedAt
    isArchived
    archivedAt
    archiveReason
    lifecycleLogs {
      action
      notes
      status
      changedAt
      changedById
    }
    createdAt
    updatedAt
  }
}

query GetEquipmentsLegacy {
  getEquipments {
    id
    name
    imageUrl
    description
    notes
    sortOrder
    status
    createdAt
    updatedAt
  }
}

query GetEquipment($id: ID!) {
  getEquipment(id: $id) {
    id
    name
    imageUrl
    description
    notes
    acquiredAt
    sortOrder
    status
    quantity
    maintenanceStartedAt
    isArchived
    archivedAt
    archiveReason
    lifecycleLogs {
      action
      notes
      status
      changedAt
      changedById
    }
    createdAt
    updatedAt
  }
}

